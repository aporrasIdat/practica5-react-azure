# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy React app to Azure Web App - app-react-practica5

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: practica5react/package-lock.json

      - name: Install dependencies
        working-directory: ./practica5react
        run: npm ci

      - name: Build React application
        working-directory: ./practica5react
        run: npm run build

      - name: Prepare deployment package
        run: |
          rm -rf deploy
          mkdir deploy
          cp practica5react/package.json deploy/
          cp practica5react/package-lock.json deploy/
          cp practica5react/server.js deploy/
          cp -r practica5react/dist deploy/

          echo "=== CONTENIDO DEL PAQUETE ==="
          find deploy -maxdepth 3 -type f | sort

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./deploy

      - name: Show deployment files
        run: |
          echo "=== ARCHIVOS QUE SE VAN A DESPLEGAR ==="
          find ./deploy -maxdepth 3 -type f | sort

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C82CFC6E870647C9BBFA78CFBDB6E0E5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5FEE7071F1E84D41A0687E6CCA43C6EE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E68982293DFC4B9BA3FD1E79E1E841E5 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-react-practica5
          slot-name: Production
          package: ./deploy
